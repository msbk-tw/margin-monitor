name: margin-monitor

# GitHub 的 cron 一律是 UTC：台北時間 = UTC + 8
on:
  schedule:
    - cron: '10 1 * * 1-5'      # 09:10 盤中
    - cron: '0 2,3,4 * * 1-5'   # 10:00 / 11:00 / 12:00 盤中
    - cron: '20 5 * * 1-5'      # 13:20 盤中
    - cron: '40 13 * * 1-5'     # 21:40 盤後基準（融資資料約 21:00 後公布）
    - cron: '30 15 * * 1-5'     # 23:30 盤後補跑（若 21:40 還沒公布）
  workflow_dispatch:
    inputs:
      mode:
        description: '執行模式'
        type: choice
        options: [baseline, intraday, backfill]
        default: baseline
      days:
        description: 'backfill 回補交易日數'
        default: '60'

permissions:
  contents: write

concurrency:
  group: margin-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main               # 排隊等候後，從最新資料開始（不是觸發當下的舊版本）

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: 決定模式
        id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "40 13 * * 1-5" ] || [ "${{ github.event.schedule }}" = "30 15 * * 1-5" ]; then
            echo "mode=baseline" >> "$GITHUB_OUTPUT"
          else
            echo "mode=intraday" >> "$GITHUB_OUTPUT"
          fi

      - name: 執行
        run: |
          case "${{ steps.m.outputs.mode }}" in
            backfill) python scripts/baseline.py --backfill "${{ inputs.days || '60' }}" ;;
            baseline) python scripts/baseline.py ;;
            intraday) python scripts/intraday.py ;;
          esac

      - name: 提交資料
        run: |
          git config user.name  "margin-bot"
          git config user.email "margin-bot@users.noreply.github.com"
          git add docs/data state
          if git diff --cached --quiet; then
            echo "沒有變更"
          else
            git commit -m "data: ${{ steps.m.outputs.mode }} $(TZ=Asia/Taipei date '+%F %H:%M')"
            if ! git pull --rebase; then
              echo "::warning::與其他更新衝突，略過本次提交"
              git rebase --abort
              exit 0
            fi
            git push
          fi
